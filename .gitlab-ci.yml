# CI/CD de aichadigital/larabill en GitLab self-hosted (ADE-295 — Fase 3, cierre).
# Traducción de .github/workflows/{tests,release}.yml.
# Runner: aichadigital-runner01 (VM 891 en prohe03), tags [aichadigital, docker].
# El runner es opt-in (run_untagged=false): sin estos tags no se ejecuta nada.
#
# Es el paquete PRODUCTO de la umbrela: contrato STABILITY.md, consumidores
# externos y 45 releases reales. Por eso es el último migrado y el único con un
# job de RELEASE traducido (release.yml sí funcionaba, a diferencia de los
# update-changelog.yml muertos del resto).
#
# Depende de cuatro paquetes de la umbrela (lara-privacy-core, lara-verifactu,
# lara100, lararoi), ya migrados: el `composer update` los resuelve por Packagist
# → dist desde sus espejos de GitHub, sin tocar esta instancia.
#
# CAMBIO DE COMPORTAMIENTO DELIBERADO (patrón de la fase): el `code-style` de
# GitHub corría `pint --test` (verifica) — aquí no hay auto-commit que retirar,
# a diferencia de laratickets/lararoi.

stages:
  - quality
  - test
  - release

default:
  tags:
    - aichadigital
    - docker
  interruptible: true

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  COMPOSER_ALLOW_SUPERUSER: "1"
  # La matriz resuelve cuatro árboles y la mutación recorre el código: el límite
  # de 300 s de Composer a sus procesos hijo está latente aquí.
  COMPOSER_PROCESS_TIMEOUT: "0"
  GIT_DEPTH: "20"

# Se permiten pipelines de rama por defecto, de MR, y de TAG `v*` (para el job de
# release). Sin la regla de tag, GitLab no crearía el pipeline del tag y la
# release nunca se emitiría.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Reglas de los jobs de CI: corren en rama/MR pero NUNCA en un pipeline de tag
# (el tag solo debe emitir la release; los tests ya pasaron antes de mergear,
# igual que en GitHub).
.rules-ci:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Paquete: sin composer.lock versionado → `composer update`, como en GitHub.
.php:
  before_script:
    - php -v | head -1
    - composer update --prefer-stable --prefer-dist --no-interaction --no-progress
  cache:
    key: "composer-php${PHP_VERSION}-l${LARAVEL}"
    paths:
      - .composer-cache/

# --- Stage: quality -----------------------------------------------------------

manifest:
  stage: quality
  image: aichadigital/laravel-ci:8.3
  rules: !reference [.rules-ci, rules]
  script:
    - composer validate --strict --no-interaction

pint:
  stage: quality
  image: aichadigital/laravel-ci:8.3
  variables:
    PHP_VERSION: "8.3"
  extends: .php
  rules: !reference [.rules-ci, rules]
  script:
    - ./vendor/bin/pint --test

phpstan:
  stage: quality
  image: aichadigital/laravel-ci:8.3
  variables:
    PHP_VERSION: "8.3"
  extends: .php
  rules: !reference [.rules-ci, rules]
  script:
    - composer phpstan

# --- Stage: test --------------------------------------------------------------

# PCOV OBLIGATORIO aunque midamos o no: phpunit.xml declara failOnWarning="true",
# y «No code coverage driver available» es un warning → sin driver la suite aborta
# sin ejecutar un test (lección de lara-verifactu, 2026-07-22). La imagen trae
# PCOV deshabilitado, así que se activa y se asierta.
pest:
  stage: test
  image: aichadigital/laravel-ci:$PHP_VERSION
  parallel:
    matrix:
      - PHP_VERSION: ["8.3", "8.4"]
        LARAVEL: "12.*"
        TESTBENCH: "10.*"
      - PHP_VERSION: ["8.3", "8.4"]
        LARAVEL: "13.*"
        TESTBENCH: "11.*"
  cache:
    key: "composer-php${PHP_VERSION}-l${LARAVEL}"
    paths:
      - .composer-cache/
  rules: !reference [.rules-ci, rules]
  before_script:
    - php -v | head -1
    - composer require "laravel/framework:${LARAVEL}" "orchestra/testbench:${TESTBENCH}" --no-interaction --no-update
    - composer update --prefer-stable --prefer-dist --no-interaction --no-progress
    - composer show -D
  script:
    - echo 'pcov.enabled=1' > /usr/local/etc/php/conf.d/zz-pcov-on.ini
    - |
      if ! php -r 'exit(ini_get("pcov.enabled") ? 0 : 1);'; then
        echo "PCOV no se activó — la suite abortaría por failOnWarning sin ejecutar nada"
        exit 1
      fi
    - ./vendor/bin/pest --ci --coverage --coverage-clover=coverage.xml
  coverage: '/Total:\s*(\d+\.\d+)\s*%/'
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 week

# Integración contra motor real MÁS la prueba de concurrencia por fork. En GitHub
# eran pasos del mismo job; se conserva así.
#
# Dos trampas silenciosas cubiertas con aserción:
#   1. GitHub publica el servicio en 127.0.0.1; GitLab lo expone por ALIAS de red.
#   2. MysqlIntegrationTestCase documenta sus «skip semantics»: sin las variables
#      LARABILL_TEST_MYSQL_* hace markTestSkipped() y «the suite stays green».
#
# La prueba de concurrencia (AID-436) NO es opcional: verifica el invariante de
# numeración (AID-390) bajo fork real, y el workflow la corría en cada push con
# RUN_CONCURRENCY_IT=1. Sin esa variable, tests/Concurrency se salta en silencio.
# La imagen trae pcntl, así que corre.
#
# AID-700 — DOS MOTORES, no uno. Hasta aquí este job solo hablaba con MySQL, y
# eso dejó sin cubrir una divergencia REAL: el primer uso de una serie fiscal
# tomaba un gap lock sobre el rango vacío, y el ciclo de locks resultante mataba
# 31 de 32 procesos concurrentes en MariaDB 11.4 mientras MySQL 9 aguantaba
# (su umbral está entre 48 y 64). El defecto era del patrón, no del motor, pero
# solo un motor lo exponía a la escala que se prueba. Mientras la matriz tenga
# un solo motor, cualquier parámetro de concurrencia está calibrado contra una
# sola realidad.
#
# El DRIVER se mantiene en `mysql` para ambos servidores a propósito: el driver
# `mariadb` nativo de Laravel 11 hace que `$table->uuid()` emita el tipo UUID
# nativo de MariaDB (BINARY(16), information_schema DATA_TYPE='uuid') en vez del
# char(36) que ADR-006/STD-001 fijan como contrato. Eso es un asunto de esquema
# —con su propio programa de actualización— y no de concurrencia; el harness ya
# acepta LARABILL_TEST_MYSQL_DRIVER para cuando se aborde.
db-integration:
  stage: test
  image: aichadigital/laravel-ci:8.3
  # AID-708 — tres combinaciones, porque el DRIVER también decide. Laravel 11
  # trajo un driver `mariadb` propio cuyo grammar emite el tipo UUID nativo de
  # MariaDB en servidores >= 10.7, mientras `MySqlGrammar` emite char(36)
  # siempre. Las dos representaciones albergan un UUID v7 y las dos están
  # soportadas; el paquete declara la semántica y no se acopla a la elección
  # del motor. La tercera entrada es la que ejercita ese camino: sin ella, el
  # combo driver=mariadb + MariaDB >= 10.7 no lo cubre nadie.
  parallel:
    matrix:
      - DB_IMAGE: "mysql:9"
        LARABILL_TEST_MYSQL_DRIVER: "mysql"
      - DB_IMAGE: "mariadb:11.4"
        LARABILL_TEST_MYSQL_DRIVER: "mysql"
      - DB_IMAGE: "mariadb:11.4"
        LARABILL_TEST_MYSQL_DRIVER: "mariadb"
  services:
    - name: $DB_IMAGE
      alias: dbhost
  variables:
    PHP_VERSION: "8.3"
    LARAVEL: "12.*"
    # La imagen de MySQL lee MYSQL_*; la de MariaDB prefiere MARIADB_* (y acepta
    # MYSQL_* como legacy). Se definen ambos: cada imagen ignora los ajenos.
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: larabill_test
    MARIADB_ROOT_PASSWORD: root
    MARIADB_DATABASE: larabill_test
    LARABILL_TEST_MYSQL_HOST: dbhost
    LARABILL_TEST_MYSQL_PORT: "3306"
    LARABILL_TEST_MYSQL_DATABASE: larabill_test
    LARABILL_TEST_MYSQL_USERNAME: root
    LARABILL_TEST_MYSQL_PASSWORD: root
  rules: !reference [.rules-ci, rules]
  before_script:
    - php -v | head -1
    - composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
    - composer update --prefer-stable --prefer-dist --no-interaction --no-progress
  script:
    # PCOV: la suite comparte phpunit.xml con failOnWarning="true".
    - echo 'pcov.enabled=1' > /usr/local/etc/php/conf.d/zz-pcov-on.ini
    - |
      if ! php -r 'exit(ini_get("pcov.enabled") ? 0 : 1);'; then
        echo "PCOV no se activó — failOnWarning abortaría la suite"
        exit 1
      fi
    # Espera con las credenciales reales (no root): comprueba que el servicio creó
    # usuario y base.
    - |
      for i in $(seq 1 60); do
        php -r 'try { new PDO("mysql:host=".getenv("LARABILL_TEST_MYSQL_HOST").";port=".getenv("LARABILL_TEST_MYSQL_PORT"), getenv("LARABILL_TEST_MYSQL_USERNAME"), getenv("LARABILL_TEST_MYSQL_PASSWORD")); exit(0); } catch (Throwable $e) { exit(1); }' && break
        sleep 2
      done
    - |
      if ! php -r 'try { new PDO("mysql:host=".getenv("LARABILL_TEST_MYSQL_HOST").";port=".getenv("LARABILL_TEST_MYSQL_PORT"), getenv("LARABILL_TEST_MYSQL_USERNAME"), getenv("LARABILL_TEST_MYSQL_PASSWORD")); exit(0); } catch (Throwable $e) { exit(1); }'; then
        echo "$DB_IMAGE no respondió en 120 s con el usuario de test"
        exit 1
      fi
    # Deja constancia en el log de CONTRA QUÉ se corrió: el nombre del job dice
    # la imagen, esto dice la versión que respondió Y el driver. Con dos jobs
    # apuntando al mismo MariaDB (AID-708), el motor por sí solo no distingue
    # cuál de los dos caminos se ejercitó.
    - |
      php -r 'echo "motor bajo prueba: ".(new PDO("mysql:host=".getenv("LARABILL_TEST_MYSQL_HOST").";port=".getenv("LARABILL_TEST_MYSQL_PORT"), getenv("LARABILL_TEST_MYSQL_USERNAME"), getenv("LARABILL_TEST_MYSQL_PASSWORD")))->query("SELECT VERSION()")->fetchColumn()." | driver: ".(getenv("LARABILL_TEST_MYSQL_DRIVER") ?: "mysql (default)").PHP_EOL;'
    - |
      set -o pipefail
      ./vendor/bin/pest tests/Integration/Mysql/ tests/Integration/InstallMysql/ tests/Integration/UpgradePath/ --ci 2>&1 | tee /tmp/db-pest.log
    - |
      if grep -qiE '[0-9]+ skipped' /tmp/db-pest.log; then
        echo "La integración contra $DB_IMAGE se SALTÓ: el TestCase no vio entorno utilizable."
        exit 1
      fi
      if ! grep -qE 'Tests:.*[0-9]+ passed' /tmp/db-pest.log; then
        echo "Ningún test pasado en la suite de integración contra $DB_IMAGE."
        exit 1
      fi
    # Prueba de concurrencia — invariante de numeración bajo fork (AID-436),
    # ahora contra CADA motor de la matriz (AID-700).
    - |
      set -o pipefail
      RUN_CONCURRENCY_IT=1 ./vendor/bin/pest tests/Concurrency/ --ci 2>&1 | tee /tmp/conc-pest.log
    - |
      if grep -qiE '[0-9]+ skipped' /tmp/conc-pest.log && ! grep -qE 'Tests:.*[0-9]+ passed' /tmp/conc-pest.log; then
        echo "La prueba de concurrencia se SALTÓ ENTERA: RUN_CONCURRENCY_IT o pcntl no surtieron efecto."
        echo "El invariante de numeración (AID-390) quedaría SIN verificar bajo fork."
        exit 1
      fi

# Mutación con gate REAL: `pest --mutate --parallel --min=68` (scope money+fiscal).
# Se conserva el umbral. PCOV obligatorio (la mutación mide cobertura) + aserción.
mutation:
  stage: test
  image: aichadigital/laravel-ci:8.3
  variables:
    PHP_VERSION: "8.3"
  extends: .php
  rules: !reference [.rules-ci, rules]
  script:
    - echo 'pcov.enabled=1' > /usr/local/etc/php/conf.d/zz-pcov-on.ini
    - |
      if ! php -r 'exit(ini_get("pcov.enabled") ? 0 : 1);'; then
        echo "PCOV no se activó — la mutación no podría medir y el gate --min=68 sería falso"
        exit 1
      fi
    - composer test-mutate

# --- Stage: release -----------------------------------------------------------
# Traducción de release.yml: en cada tag `v*`, crear la Release NATIVA de GitLab
# con las notas de ESTA versión extraídas del CHANGELOG (misma lógica awk que
# GitHub). Decisión del operador (2026-07-22): las releases pasan a vivir donde
# vive el desarrollo — soberanía (ADE-291).
#
# No re-ejecuta los tests: el tag se empuja sobre un main ya verde, igual que en
# GitHub. El `release:` usa CI_JOB_TOKEN automáticamente, acotado a este proyecto.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  needs: []
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # Extrae la sección "## [X.Y.Z]" hasta la siguiente "## [" — idéntico al awk
    # del workflow de GitHub.
    - awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md
    - '[ -s release_notes.md ] || echo "Release ${CI_COMMIT_TAG}" > release_notes.md'
    - echo "Emitiendo release ${CI_COMMIT_TAG} ($(wc -l < release_notes.md) líneas de notas)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "./release_notes.md"
